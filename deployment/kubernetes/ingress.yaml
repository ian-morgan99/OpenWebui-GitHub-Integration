apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-architect-server
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.github-architect.example.com
    secretName: github-architect-tls
  rules:
  - host: api.github-architect.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: github-architect-server
            port:
              number: 80
